<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Envelope Tests</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a1a;
      color: #e0e0e0;
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      padding: 2rem;
      line-height: 1.6;
    }
    h1 {
      color: #fff;
      margin-bottom: 1rem;
      font-size: 1.4rem;
    }
    button {
      background: #333;
      color: #e0e0e0;
      border: 1px solid #555;
      padding: 0.5rem 1rem;
      font-family: inherit;
      font-size: 0.9rem;
      cursor: pointer;
      margin-right: 0.5rem;
      margin-bottom: 1rem;
      border-radius: 3px;
    }
    button:hover { background: #444; }
    button:active { background: #555; }
    #log {
      background: #111;
      border: 1px solid #333;
      padding: 1rem;
      font-size: 0.85rem;
      white-space: pre-wrap;
      word-wrap: break-word;
      min-height: 300px;
      border-radius: 3px;
    }
    .pass { color: #4ec96e; }
    .fail { color: #e85454; }
  </style>
</head>
<body>
  <h1>Envelope Tests</h1>
  <button id="btn-play">&#9654; Resume AudioContext</button>
  <button id="btn-run">Run Tests</button>
  <pre id="log"></pre>

  <script type="module">
    import { attack, decay, floor } from '../src/audio/env.js';

    const logEl = document.getElementById('log');
    const btnPlay = document.getElementById('btn-play');
    const btnRun = document.getElementById('btn-run');

    let ctx;

    function log(msg, cls) {
      const span = document.createElement('span');
      if (cls) span.className = cls;
      span.textContent = msg + '\n';
      logEl.appendChild(span);
    }

    function pass(name) { log(`\u2713 ${name}`, 'pass'); }
    function fail(name, err) { log(`\u2717 ${name}: ${err}`, 'fail'); }

    // Create a white noise buffer (mono, 1 second)
    function createNoiseBuf(ctx) {
      const buf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < data.length; i++) data[i] = Math.random() * 2 - 1;
      return buf;
    }

    // Create a noise source from buffer, returns AudioBufferSourceNode
    function noiseSource(ctx, buf) {
      const src = ctx.createBufferSource();
      src.buffer = buf;
      return src;
    }

    // Test 1: floor() correctness
    async function testFloor() {
      const name = 'floor() correctness';
      try {
        if (floor(0) !== 0.0001) throw new Error(`floor(0) = ${floor(0)}`);
        if (floor(-5) !== 0.0001) throw new Error(`floor(-5) = ${floor(-5)}`);
        if (floor(0.5) !== 0.5) throw new Error(`floor(0.5) = ${floor(0.5)}`);
        if (floor(1) !== 1) throw new Error(`floor(1) = ${floor(1)}`);
        if (floor(0.0001) !== 0.0001) throw new Error(`floor(0.0001) = ${floor(0.0001)}`);
        pass(name);
      } catch (e) { fail(name, e.message); }
    }

    // Test 2: Attack ramp (audible fade-in)
    async function testAttack() {
      const name = 'Attack ramp (smooth fade-in, no click)';
      try {
        const noiseBuf = createNoiseBuf(ctx);
        const src = noiseSource(ctx, noiseBuf);
        const gain = ctx.createGain();
        gain.gain.value = 0;

        src.connect(gain).connect(ctx.destination);

        const now = ctx.currentTime;
        attack(ctx, gain.gain, now, 1.0, 0.1); // 100ms linear ramp 0→1
        src.start(now);
        src.stop(now + 0.2); // 200ms burst

        // Wait for it to play
        await new Promise(r => setTimeout(r, 250));
        pass(name + ' (listen for smooth fade-in)');
      } catch (e) { fail(name, e.message); }
    }

    // Test 3: Decay ramp (audible fade-out)
    async function testDecay() {
      const name = 'Decay ramp (smooth fade-out)';
      try {
        const noiseBuf = createNoiseBuf(ctx);
        const src = noiseSource(ctx, noiseBuf);
        const gain = ctx.createGain();
        gain.gain.value = 1.0;

        src.connect(gain).connect(ctx.destination);

        const now = ctx.currentTime;
        decay(ctx, gain.gain, now, 0.0001, 0.5); // 500ms exponential decay
        src.start(now);
        src.stop(now + 0.6);

        await new Promise(r => setTimeout(r, 650));
        pass(name + ' (listen for smooth tail)');
      } catch (e) { fail(name, e.message); }
    }

    // Test 4: Decay to 0 snaps to true zero
    async function testDecayToZero() {
      const name = 'Decay to 0 snaps to true zero (no hanging hum)';
      try {
        const noiseBuf = createNoiseBuf(ctx);
        const src = noiseSource(ctx, noiseBuf);
        const gain = ctx.createGain();
        gain.gain.value = 1.0;

        const analyser = ctx.createAnalyser();
        analyser.fftSize = 256;

        src.connect(gain).connect(analyser).connect(ctx.destination);

        const now = ctx.currentTime;
        decay(ctx, gain.gain, now, 0, 0.2); // decay to 0 over 200ms
        src.start(now);
        src.stop(now + 0.5);

        // Wait for decay to complete + a little extra
        await new Promise(r => setTimeout(r, 350));

        // Check that signal is effectively silent after decay
        const buf = new Float32Array(analyser.fftSize);
        analyser.getFloatTimeDomainData(buf);
        let peak = 0;
        for (let i = 0; i < buf.length; i++) {
          const abs = Math.abs(buf[i]);
          if (abs > peak) peak = abs;
        }

        if (peak > 0.001) throw new Error(`still audible after decay (peak=${peak.toFixed(6)})`);
        pass(name + ` (peak after decay: ${peak.toFixed(6)})`);
      } catch (e) { fail(name, e.message); }
    }

    // Test 5: Full attack+decay envelope (audible shape)
    async function testAttackDecay() {
      const name = 'Attack+Decay envelope (natural shape)';
      try {
        const noiseBuf = createNoiseBuf(ctx);
        const src = noiseSource(ctx, noiseBuf);
        const gain = ctx.createGain();
        gain.gain.value = 0;

        src.connect(gain).connect(ctx.destination);

        const now = ctx.currentTime;
        // Attack: 0→1 over 50ms
        attack(ctx, gain.gain, now, 1.0, 0.05);
        // Decay: 1→0 starting at now+0.05, over 300ms
        // Note: we schedule decay after attack finishes
        // Use a setTimeout to schedule the decay call after the attack time

        src.start(now);
        src.stop(now + 0.4);

        // Schedule decay to start after attack completes
        setTimeout(() => {
          decay(ctx, gain.gain, ctx.currentTime, 0, 0.3);
        }, 60); // slightly after the 50ms attack

        await new Promise(r => setTimeout(r, 450));
        pass(name + ' (listen for natural attack-decay burst)');
      } catch (e) { fail(name, e.message); }
    }

    btnPlay.addEventListener('click', async () => {
      if (!ctx) ctx = new AudioContext();
      await ctx.resume();
      log('AudioContext resumed (' + ctx.state + ')');
    });

    btnRun.addEventListener('click', async () => {
      if (!ctx) ctx = new AudioContext();
      if (ctx.state === 'suspended') await ctx.resume();
      logEl.textContent = '';
      log('Running envelope tests...\n');
      log('Audible verification: listen for three smooth bursts');
      log('  1. Fade-in (attack)');
      log('  2. Fade-out (decay)');
      log('  3. Attack+decay shape\n');

      await testFloor();
      await testAttack();
      await testDecay();
      await testDecayToZero();
      await testAttackDecay();

      log('\nDone.');
    });
  </script>
</body>
</html>
