<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Master Chain Tests</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a1a;
      color: #e0e0e0;
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      padding: 2rem;
      line-height: 1.6;
    }
    h1 {
      color: #fff;
      margin-bottom: 1rem;
      font-size: 1.4rem;
    }
    button {
      background: #333;
      color: #e0e0e0;
      border: 1px solid #555;
      padding: 0.5rem 1rem;
      font-family: inherit;
      font-size: 0.9rem;
      cursor: pointer;
      margin-right: 0.5rem;
      margin-bottom: 1rem;
      border-radius: 3px;
    }
    button:hover { background: #444; }
    button:active { background: #555; }
    #log {
      background: #111;
      border: 1px solid #333;
      padding: 1rem;
      font-size: 0.85rem;
      white-space: pre-wrap;
      word-wrap: break-word;
      min-height: 300px;
      border-radius: 3px;
    }
    .pass { color: #4ec96e; }
    .fail { color: #e85454; }
  </style>
</head>
<body>
  <h1>Master Chain Tests</h1>
  <button id="btn-play">&#9654; Resume AudioContext</button>
  <button id="btn-run">Run Tests</button>
  <pre id="log"></pre>

  <script type="module">
    import { createMaster } from '../src/audio/master.js';

    const logEl = document.getElementById('log');
    const btnPlay = document.getElementById('btn-play');
    const btnRun = document.getElementById('btn-run');

    let ctx;

    function log(msg, cls) {
      const span = document.createElement('span');
      if (cls) span.className = cls;
      span.textContent = msg + '\n';
      logEl.appendChild(span);
    }

    function pass(name) { log(`\u2713 ${name}`, 'pass'); }
    function fail(name, err) { log(`\u2717 ${name}: ${err}`, 'fail'); }

    function approx(a, b, tol = 0.001) {
      return Math.abs(a - b) <= tol;
    }

    btnPlay.addEventListener('click', async () => {
      if (!ctx) ctx = new AudioContext();
      await ctx.resume();
      log('AudioContext resumed (' + ctx.state + ')');
    });

    btnRun.addEventListener('click', async () => {
      if (!ctx) ctx = new AudioContext();
      if (ctx.state === 'suspended') await ctx.resume();
      logEl.textContent = '';
      log('Running tests...\n');

      await testShape();
      await testCompressorParams();
      await testLimiterParams();
      await testGainValues();
      await testSignalFlow();
      await testDisconnect();

      log('\nDone.');
    });

    // Test 1: createMaster returns correct shape
    async function testShape() {
      const name = 'createMaster returns correct shape';
      try {
        const m = createMaster(ctx);
        const keys = ['input', 'gain', 'compressor', 'limiter', 'analyser',
                      'reverbSend', 'delaySend', 'connect', 'disconnect'];
        for (const k of keys) {
          if (!(k in m)) throw new Error(`missing property: ${k}`);
        }
        if (!(m.input instanceof GainNode)) throw new Error('input not a GainNode');
        if (!(m.compressor instanceof DynamicsCompressorNode)) throw new Error('compressor not a DynamicsCompressorNode');
        if (!(m.analyser instanceof AnalyserNode)) throw new Error('analyser not an AnalyserNode');
        if (typeof m.connect !== 'function') throw new Error('connect not a function');
        if (typeof m.disconnect !== 'function') throw new Error('disconnect not a function');
        m.disconnect();
        pass(name);
      } catch (e) {
        fail(name, e.message);
      }
    }

    // Test 2: Compressor parameters
    async function testCompressorParams() {
      const name = 'Compressor parameters';
      try {
        const m = createMaster(ctx);
        const c = m.compressor;
        if (c.threshold.value !== -14) throw new Error(`threshold: ${c.threshold.value}`);
        if (c.knee.value !== 8) throw new Error(`knee: ${c.knee.value}`);
        if (c.ratio.value !== 4) throw new Error(`ratio: ${c.ratio.value}`);
        if (!approx(c.attack.value, 0.004)) throw new Error(`attack: ${c.attack.value}`);
        if (!approx(c.release.value, 0.250)) throw new Error(`release: ${c.release.value}`);
        m.disconnect();
        pass(name);
      } catch (e) {
        fail(name, e.message);
      }
    }

    // Test 3: Limiter parameters
    async function testLimiterParams() {
      const name = 'Limiter parameters';
      try {
        const m = createMaster(ctx);
        const l = m.limiter;
        if (l.threshold.value !== -1.5) throw new Error(`threshold: ${l.threshold.value}`);
        if (l.knee.value !== 0) throw new Error(`knee: ${l.knee.value}`);
        if (l.ratio.value !== 20) throw new Error(`ratio: ${l.ratio.value}`);
        if (!approx(l.attack.value, 0.001)) throw new Error(`attack: ${l.attack.value}`);
        if (!approx(l.release.value, 0.060)) throw new Error(`release: ${l.release.value}`);
        m.disconnect();
        pass(name);
      } catch (e) {
        fail(name, e.message);
      }
    }

    // Test 4: Gain values
    async function testGainValues() {
      const name = 'Gain values';
      try {
        const m = createMaster(ctx);
        if (!approx(m.gain.gain.value, 0.7)) throw new Error(`gain: ${m.gain.gain.value}`);
        if (!approx(m.reverbSend.gain.value, 0.15)) throw new Error(`reverbSend: ${m.reverbSend.gain.value}`);
        if (!approx(m.delaySend.gain.value, 0.1)) throw new Error(`delaySend: ${m.delaySend.gain.value}`);
        if (m.input.gain.value !== 1) throw new Error(`input gain: ${m.input.gain.value}`);
        m.disconnect();
        pass(name);
      } catch (e) {
        fail(name, e.message);
      }
    }

    // Test 5: Signal passes through (peak meter check)
    async function testSignalFlow() {
      const name = 'Signal passes through (peak meter)';
      try {
        const m = createMaster(ctx);
        m.connect(ctx.destination);

        const osc = ctx.createOscillator();
        osc.frequency.value = 440;
        osc.connect(m.input);
        osc.start();

        // Wait 100ms for signal to propagate
        await new Promise(r => setTimeout(r, 100));

        const buf = new Float32Array(m.analyser.fftSize);
        m.analyser.getFloatTimeDomainData(buf);

        let peak = 0;
        for (let i = 0; i < buf.length; i++) {
          const abs = Math.abs(buf[i]);
          if (abs > peak) peak = abs;
        }

        osc.stop();
        osc.disconnect();

        if (peak <= 0) throw new Error(`no signal detected (peak=${peak})`);
        if (peak >= 1.0) throw new Error(`limiter not working (peak=${peak})`);

        m.disconnect();
        pass(name + ` (peak=${peak.toFixed(4)})`);
      } catch (e) {
        fail(name, e.message);
      }
    }

    // Test 6: Disconnect tears down cleanly
    async function testDisconnect() {
      const name = 'Disconnect tears down cleanly';
      try {
        const m1 = createMaster(ctx);
        m1.connect(ctx.destination);
        m1.disconnect(); // should not throw

        // Create a fresh master, connect and disconnect again
        const m2 = createMaster(ctx);
        m2.connect(ctx.destination);
        m2.disconnect(); // should not throw

        pass(name);
      } catch (e) {
        fail(name, e.message);
      }
    }
  </script>
</body>
</html>
