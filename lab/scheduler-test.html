<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scheduler Tests</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a1a;
      color: #e0e0e0;
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      padding: 2rem;
      line-height: 1.6;
    }
    h1 { color: #fff; margin-bottom: 1rem; font-size: 1.4rem; }
    button {
      background: #333;
      color: #e0e0e0;
      border: 1px solid #555;
      padding: 0.5rem 1rem;
      font-family: inherit;
      font-size: 0.9rem;
      cursor: pointer;
      margin-right: 0.5rem;
      margin-bottom: 1rem;
      border-radius: 3px;
    }
    button:hover { background: #444; }
    button:active { background: #555; }
    #log {
      background: #111;
      border: 1px solid #333;
      padding: 1rem;
      font-size: 0.85rem;
      white-space: pre-wrap;
      word-wrap: break-word;
      min-height: 300px;
      border-radius: 3px;
    }
    .pass { color: #4ec96e; }
    .fail { color: #e85454; }
    .info { color: #6eb8e0; }
    #flash {
      position: fixed;
      top: 1rem;
      right: 1rem;
      width: 30px;
      height: 30px;
      background: #fff;
      opacity: 0;
      border-radius: 4px;
      transition: opacity 0.02s;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <h1>Scheduler Tests</h1>
  <button id="btn-play">&#9654; Resume AudioContext</button>
  <button id="btn-run">Run Tests</button>
  <div id="flash"></div>
  <pre id="log"></pre>

  <script type="module">
    import { start, stop, isPlaying } from '../src/audio/scheduler.js';
    import { getContext, ensureResumed } from '../src/audio/context.js';
    import { attack, decay } from '../src/audio/env.js';

    const logEl = document.getElementById('log');
    const btnPlay = document.getElementById('btn-play');
    const btnRun = document.getElementById('btn-run');
    const flashEl = document.getElementById('flash');

    function log(msg, cls) {
      const span = document.createElement('span');
      if (cls) span.className = cls;
      span.textContent = msg + '\n';
      logEl.appendChild(span);
      logEl.scrollTop = logEl.scrollHeight;
    }
    function pass(name) { log(`\u2713 ${name}`, 'pass'); }
    function fail(name, err) { log(`\u2717 ${name}: ${err}`, 'fail'); }
    function info(msg) { log(`  ${msg}`, 'info'); }

    // Visual flash — white square pulses for 100ms
    function flash() {
      flashEl.style.opacity = '1';
      setTimeout(() => { flashEl.style.opacity = '0'; }, 100);
    }

    // Test voice with full diagnostics
    function testVoice(ctx, destination, time, params) {
      console.log(`play() at t=${time.toFixed(4)}s, creating oscillator`);

      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = 440 + params.voice * 100;
      gain.gain.value = 0;

      osc.connect(gain);
      gain.connect(destination);
      console.log(`connected, gain=${gain.gain.value}`);

      // Attack: 0→0.5 over 5ms (punchy, audible)
      attack(ctx, gain.gain, time, 0.5, 0.005);
      // Decay: 0.5→0 over 10ms (punchy click)
      decay(ctx, gain.gain, time + 0.005, 0, 0.01);

      const stopTime = time + 0.015;
      osc.start(time);
      osc.stop(stopTime);
      console.log(`start(${time.toFixed(4)}), stop(${stopTime.toFixed(4)})`);

      return time;
    }

    let scheduledTimes = [];

    // Wrapper that records scheduled times and triggers flash
    function recordingVoice(ctx, destination, time, params) {
      if (params.voice === 0) {
        scheduledTimes.push({ time, step: params.step, ctxTime: ctx.currentTime });
        flash();
      }
      testVoice(ctx, destination, time, params);
    }

    btnPlay.addEventListener('click', async () => {
      await ensureResumed();
      const ctx = getContext();
      log(`AudioContext resumed (${ctx.state})`);
    });

    btnRun.addEventListener('click', async () => {
      logEl.textContent = '';
      log('Scheduler Tests (with diagnostics)\n');

      const ctx = getContext();
      if (ctx.state === 'suspended') {
        await ensureResumed();
      }

      scheduledTimes = [];

      // Test 1: Start scheduler
      try {
        const voices = Array(5).fill(recordingVoice);
        start({ bpm: 120, stepsPerLoop: 16, voices, dest: ctx.destination });

        if (isPlaying()) {
          pass('Scheduler started');
        } else {
          fail('Scheduler started', 'isPlaying() returned false');
          return;
        }
      } catch (e) {
        fail('Scheduler started', e.message);
        return;
      }

      info('Running for 10 seconds... listen for steady 120 BPM clicks');
      info('Watch the white flash in the top-right corner');
      info('Check browser console for per-note diagnostics\n');

      // Let it run for 10 seconds
      await new Promise(r => setTimeout(r, 10000));

      // Stop and analyze
      stop();

      // Test 2: Clock worker was running (notes were scheduled)
      if (scheduledTimes.length > 0) {
        pass(`Clock worker running (${scheduledTimes.length} steps scheduled)`);
      } else {
        fail('Clock worker running', 'no steps were scheduled');
        return;
      }

      // Test 3: First note scheduled at a reasonable time
      const first = scheduledTimes[0];
      if (first.time > 0) {
        pass(`First note scheduled at t=${first.time.toFixed(4)}s`);
      } else {
        fail('First note scheduled', `time=${first.time}`);
      }

      // Test 4: Regular intervals (~0.125s per step at 120 BPM, 16 steps)
      const expectedInterval = 0.125;
      let intervalOk = true;
      let maxDrift = 0;
      const deltas = [];

      for (let i = 1; i < scheduledTimes.length; i++) {
        const delta = scheduledTimes[i].time - scheduledTimes[i - 1].time;
        deltas.push(delta);
        const drift = Math.abs(delta - expectedInterval);
        if (drift > maxDrift) maxDrift = drift;
        if (drift > 0.02) {
          intervalOk = false;
        }
      }

      if (intervalOk) {
        pass(`Notes at regular intervals (expected ${expectedInterval}s, max drift ${(maxDrift * 1000).toFixed(1)}ms)`);
      } else {
        fail('Notes at regular intervals', `max drift ${(maxDrift * 1000).toFixed(1)}ms exceeds 20ms tolerance`);
      }

      // Test 5: No scheduling in the past
      let allFuture = true;
      let worstPast = 0;
      for (const entry of scheduledTimes) {
        const margin = entry.time - entry.ctxTime;
        if (margin < 0) {
          allFuture = false;
          if (margin < worstPast) worstPast = margin;
        }
      }

      if (allFuture) {
        pass('No scheduling in the past (all times >= ctx.currentTime)');
      } else {
        fail('No scheduling in the past', `worst case: ${(worstPast * 1000).toFixed(1)}ms behind`);
      }

      // Test 6: Loop ran for full duration without stall
      const totalDuration = scheduledTimes[scheduledTimes.length - 1].time - scheduledTimes[0].time;
      if (totalDuration >= 9.0) {
        pass(`Loop continued for ${totalDuration.toFixed(1)}s without stall`);
      } else {
        fail('Loop continued without stall', `only ${totalDuration.toFixed(1)}s of scheduled events`);
      }

      // Summary
      info(`\nSummary: ${scheduledTimes.length} steps, ${totalDuration.toFixed(2)}s total`);
      info(`Step interval: avg ${(deltas.reduce((a,b) => a+b, 0) / deltas.length * 1000).toFixed(1)}ms`);
      info(`Gain: 0.5, decay: 10ms (punchy click)`);

      log('\nDone.');
    });
  </script>
</body>
</html>
