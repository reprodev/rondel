<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Noise Source Tests</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a1a;
      color: #e0e0e0;
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      padding: 2rem;
      line-height: 1.6;
    }
    h1 {
      color: #fff;
      margin-bottom: 1rem;
      font-size: 1.4rem;
    }
    button {
      background: #333;
      color: #e0e0e0;
      border: 1px solid #555;
      padding: 0.5rem 1rem;
      font-family: inherit;
      font-size: 0.9rem;
      cursor: pointer;
      margin-right: 0.5rem;
      margin-bottom: 1rem;
      border-radius: 3px;
    }
    button:hover { background: #444; }
    button:active { background: #555; }
    #log {
      background: #111;
      border: 1px solid #333;
      padding: 1rem;
      font-size: 0.85rem;
      white-space: pre-wrap;
      word-wrap: break-word;
      min-height: 300px;
      border-radius: 3px;
    }
    .pass { color: #4ec96e; }
    .fail { color: #e85454; }
  </style>
</head>
<body>
  <h1>Noise Source Tests</h1>
  <button id="btn-play">&#9654; Resume AudioContext</button>
  <button id="btn-run">Run Tests</button>
  <pre id="log"></pre>

  <script type="module">
    import { initNoise, getNoise, createNoiseSource } from '../src/audio/noise.js';

    const logEl = document.getElementById('log');
    const btnPlay = document.getElementById('btn-play');
    const btnRun = document.getElementById('btn-run');

    let ctx;

    function log(msg, cls) {
      const span = document.createElement('span');
      if (cls) span.className = cls;
      span.textContent = msg + '\n';
      logEl.appendChild(span);
    }

    function pass(name) { log(`\u2713 ${name}`, 'pass'); }
    function fail(name, err) { log(`\u2717 ${name}: ${err}`, 'fail'); }

    function approx(a, b, tol = 0.01) {
      return Math.abs(a - b) <= tol;
    }

    btnPlay.addEventListener('click', async () => {
      if (!ctx) ctx = new AudioContext();
      await ctx.resume();
      log('AudioContext resumed (' + ctx.state + ')');
    });

    btnRun.addEventListener('click', async () => {
      if (!ctx) ctx = new AudioContext();
      if (ctx.state === 'suspended') await ctx.resume();
      logEl.textContent = '';
      log('Running tests...\n');

      await testInitNoise();
      await testIdempotent();
      await testGetNoise();
      await testGetNoiseThrows();
      await testBufferContents();
      await testCreateNoiseSource();
      await testMultipleSources();
      await testAudiblePlayback();

      log('\nDone.');
    });

    // Test 1: initNoise creates a buffer
    async function testInitNoise() {
      const name = 'initNoise creates a buffer';
      try {
        const buf = initNoise(ctx);
        if (!(buf instanceof AudioBuffer)) throw new Error('result is not an AudioBuffer');
        if (buf.numberOfChannels !== 2) throw new Error(`numberOfChannels: ${buf.numberOfChannels}`);
        if (!approx(buf.duration, 2.0)) throw new Error(`duration: ${buf.duration}`);
        if (buf.sampleRate !== ctx.sampleRate) throw new Error(`sampleRate: ${buf.sampleRate} !== ${ctx.sampleRate}`);
        pass(name);
      } catch (e) {
        fail(name, e.message);
      }
    }

    // Test 2: initNoise is idempotent (cached)
    async function testIdempotent() {
      const name = 'initNoise is idempotent (cached)';
      try {
        const buf1 = initNoise(ctx);
        const buf2 = initNoise(ctx);
        if (buf1 !== buf2) throw new Error('returned different objects');
        pass(name);
      } catch (e) {
        fail(name, e.message);
      }
    }

    // Test 3: getNoise returns cached buffer
    async function testGetNoise() {
      const name = 'getNoise returns cached buffer';
      try {
        const fromInit = initNoise(ctx);
        const fromGet = getNoise(ctx);
        if (fromInit !== fromGet) throw new Error('getNoise returned different object');
        pass(name);
      } catch (e) {
        fail(name, e.message);
      }
    }

    // Test 4: getNoise throws before init
    async function testGetNoiseThrows() {
      const name = 'getNoise throws before init';
      try {
        const newCtx = new AudioContext();
        let threw = false;
        try {
          getNoise(newCtx);
        } catch (err) {
          if (!err.message.includes('not initialized')) {
            throw new Error(`wrong error message: "${err.message}"`);
          }
          threw = true;
        }
        await newCtx.close();
        if (!threw) throw new Error('getNoise did not throw');
        pass(name);
      } catch (e) {
        fail(name, e.message);
      }
    }

    // Test 5: Buffer contains actual noise (not silence)
    async function testBufferContents() {
      const name = 'Buffer contains actual noise (not silence)';
      try {
        const buf = getNoise(ctx);
        const data = buf.getChannelData(0);
        let hasNonZero = false;
        let hasPositive = false;
        let hasNegative = false;

        for (let i = 0; i < data.length; i++) {
          if (data[i] < -1 || data[i] > 1) throw new Error(`sample out of range: ${data[i]}`);
          if (data[i] !== 0) hasNonZero = true;
          if (data[i] > 0) hasPositive = true;
          if (data[i] < 0) hasNegative = true;
        }

        if (!hasNonZero) throw new Error('all samples are zero');
        if (!hasPositive) throw new Error('no positive samples');
        if (!hasNegative) throw new Error('no negative samples');
        pass(name);
      } catch (e) {
        fail(name, e.message);
      }
    }

    // Test 6: createNoiseSource returns a started source
    async function testCreateNoiseSource() {
      const name = 'createNoiseSource returns a started source';
      try {
        const source = createNoiseSource(ctx, ctx.currentTime + 0.1);
        if (!(source instanceof AudioBufferSourceNode)) throw new Error('not an AudioBufferSourceNode');
        source.connect(ctx.destination);
        source.stop(ctx.currentTime + 0.15);
        await new Promise(r => setTimeout(r, 50));
        pass(name);
      } catch (e) {
        fail(name, e.message);
      }
    }

    // Test 7: Multiple sources have different offsets (no phase-lock)
    async function testMultipleSources() {
      const name = 'Multiple sources (no phase-lock crash)';
      try {
        const silentGain = ctx.createGain();
        silentGain.gain.value = 0;
        silentGain.connect(ctx.destination);

        for (let i = 0; i < 10; i++) {
          const source = createNoiseSource(ctx, ctx.currentTime);
          source.connect(silentGain);
          source.stop(ctx.currentTime + 0.01);
        }

        await new Promise(r => setTimeout(r, 50));
        silentGain.disconnect();
        pass(name);
      } catch (e) {
        fail(name, e.message);
      }
    }

    // Test 8: Audible playback (manual verify)
    async function testAudiblePlayback() {
      const name = 'Audible playback (manual verify)';
      try {
        log('  Playing 4 noise bursts (50ms each, 200ms apart)...');
        const gain = ctx.createGain();
        gain.gain.value = 0.3;
        gain.connect(ctx.destination);

        for (let i = 0; i < 4; i++) {
          const t = ctx.currentTime + i * 0.2;
          const source = createNoiseSource(ctx, t);
          source.connect(gain);
          source.stop(t + 0.05);
        }

        await new Promise(r => setTimeout(r, 900));
        gain.disconnect();
        pass(name);
      } catch (e) {
        fail(name, e.message);
      }
    }
  </script>
</body>
</html>
