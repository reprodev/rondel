<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Clock Worker Tests</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a1a;
      color: #e0e0e0;
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      padding: 2rem;
      line-height: 1.6;
    }
    h1 { color: #fff; margin-bottom: 1rem; font-size: 1.4rem; }
    button {
      background: #333;
      color: #e0e0e0;
      border: 1px solid #555;
      padding: 0.5rem 1rem;
      font-family: inherit;
      font-size: 0.9rem;
      cursor: pointer;
      margin-right: 0.5rem;
      margin-bottom: 1rem;
      border-radius: 3px;
    }
    button:hover { background: #444; }
    button:active { background: #555; }
    #log {
      background: #111;
      border: 1px solid #333;
      padding: 1rem;
      font-size: 0.85rem;
      white-space: pre-wrap;
      word-wrap: break-word;
      min-height: 300px;
      border-radius: 3px;
    }
    .pass { color: #4ec96e; }
    .fail { color: #e85454; }
    .info { color: #6eb8e0; }
  </style>
</head>
<body>
  <h1>Clock Worker Tests</h1>
  <button id="btn-run">Run Tests</button>
  <pre id="log"></pre>

  <script type="module">
    const logEl = document.getElementById('log');
    const btnRun = document.getElementById('btn-run');

    function log(msg, cls) {
      const span = document.createElement('span');
      if (cls) span.className = cls;
      span.textContent = msg + '\n';
      logEl.appendChild(span);
    }
    function pass(name) { log(`\u2713 ${name}`, 'pass'); }
    function fail(name, err) { log(`\u2717 ${name}: ${err}`, 'fail'); }
    function info(msg) { log(`  ${msg}`, 'info'); }

    btnRun.addEventListener('click', async () => {
      logEl.textContent = '';
      log('Clock Worker Tests\n');

      // Test 1: Spawn worker
      let worker;
      try {
        worker = new Worker('../src/audio/clock.worker.js');
        pass('Worker spawned (no error)');
      } catch (e) {
        fail('Worker spawned', e.message);
        return;
      }

      // Test 2-5: Collect ticks for 1 second
      info('Verifying tick rhythm...');

      const ticks = [];
      const collectStart = performance.now();

      await new Promise((resolve) => {
        worker.onmessage = (e) => {
          if (e.data.type === 'tick') {
            ticks.push(e.data);
          }
        };
        worker.postMessage({ command: 'start' });
        setTimeout(resolve, 1000);
      });

      worker.postMessage({ command: 'stop' });

      // Test 2: Ticks received count
      const count = ticks.length;
      if (count > 0) {
        pass(`Ticks received: ${count}`);
      } else {
        fail('Ticks received', '0 ticks received');
      }

      // Test 3: Rate is ~40 ±5
      if (count >= 35 && count <= 45) {
        pass(`Tick rate correct (${count} ticks in 1s, expected 40 \u00b1 5)`);
      } else {
        fail(`Tick rate correct`, `got ${count}, expected 35-45`);
      }

      // Test 4: Each tick includes time value
      const allHaveTime = ticks.every(t => typeof t.time === 'number' && t.time > 0);
      if (allHaveTime) {
        pass('Each tick includes time: performance.now() value');
      } else {
        fail('Each tick includes time', 'some ticks missing time property');
      }

      // Test 5: Monotonic increasing times
      let monotonic = true;
      for (let i = 1; i < ticks.length; i++) {
        if (ticks[i].time <= ticks[i - 1].time) {
          monotonic = false;
          break;
        }
      }
      if (monotonic) {
        pass('No duplicate times (monotonic increasing)');
      } else {
        fail('No duplicate times', 'found non-monotonic timestamp');
      }

      // Test 6: Visibility change (simulate hidden → visible)
      info('Testing visibility change...');

      worker.postMessage({ command: 'start' });

      // Simulate going hidden
      worker.postMessage({ command: 'visibility', hidden: true });

      // Collect config response
      const configPromise = new Promise((resolve) => {
        const handler = (e) => {
          if (e.data.type === 'config') {
            worker.removeEventListener('message', handler);
            resolve(e.data);
          }
        };
        worker.addEventListener('message', handler);
      });

      const hiddenConfig = await configPromise;
      if (hiddenConfig.tickInterval === 100 && hiddenConfig.lookahead === 0.75) {
        pass(`Visibility hidden: interval=${hiddenConfig.tickInterval}ms, lookahead=${hiddenConfig.lookahead}s`);
      } else {
        fail('Visibility hidden config', `got interval=${hiddenConfig.tickInterval}, lookahead=${hiddenConfig.lookahead}`);
      }

      // Wait 500ms in "hidden" mode, collect ticks
      const hiddenTicks = [];
      await new Promise((resolve) => {
        worker.onmessage = (e) => {
          if (e.data.type === 'tick') hiddenTicks.push(e.data);
        };
        setTimeout(resolve, 500);
      });

      // Should get ~5 ticks at 100ms rate in 500ms
      info(`  Hidden mode: ${hiddenTicks.length} ticks in 500ms (expect ~5)`);

      // Simulate coming back visible
      const visibleConfigPromise = new Promise((resolve) => {
        const handler = (e) => {
          if (e.data.type === 'config') {
            worker.removeEventListener('message', handler);
            resolve(e.data);
          }
        };
        worker.addEventListener('message', handler);
      });

      worker.postMessage({ command: 'visibility', hidden: false });
      const visibleConfig = await visibleConfigPromise;

      if (visibleConfig.tickInterval === 25 && visibleConfig.lookahead === 0.1) {
        pass(`Visibility visible: interval=${visibleConfig.tickInterval}ms, lookahead=${visibleConfig.lookahead}s`);
      } else {
        fail('Visibility visible config', `got interval=${visibleConfig.tickInterval}, lookahead=${visibleConfig.lookahead}`);
      }

      // Collect ticks for 500ms after restoring visibility to verify no stall
      const resumedTicks = [];
      await new Promise((resolve) => {
        worker.onmessage = (e) => {
          if (e.data.type === 'tick') resumedTicks.push(e.data);
        };
        setTimeout(resolve, 500);
      });

      if (resumedTicks.length >= 15) {
        pass(`Ticks resume after visibility restore (${resumedTicks.length} in 500ms)`);
      } else {
        fail('Ticks resume after visibility restore', `only ${resumedTicks.length} ticks in 500ms`);
      }

      // Cleanup
      worker.postMessage({ command: 'stop' });
      worker.terminate();
      info('Worker terminated.');

      log('\nDone.');
    });
  </script>
</body>
</html>
