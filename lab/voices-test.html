<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Voices Test</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a1a1a;
      color: #e0e0e0;
      font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
      padding: 2rem;
      line-height: 1.6;
    }
    h1 { color: #fff; margin-bottom: 1rem; font-size: 1.4rem; }
    button {
      background: #333;
      color: #e0e0e0;
      border: 1px solid #555;
      padding: 0.5rem 1rem;
      font-family: inherit;
      font-size: 0.9rem;
      cursor: pointer;
      margin-right: 0.5rem;
      margin-bottom: 1rem;
      border-radius: 3px;
    }
    button:hover { background: #444; }
    button:active { background: #555; }
    #log {
      background: #111;
      border: 1px solid #333;
      padding: 1rem;
      font-size: 0.85rem;
      white-space: pre-wrap;
      word-wrap: break-word;
      min-height: 300px;
      border-radius: 3px;
      margin-bottom: 1rem;
    }
    .pass { color: #4ec96e; }
    .fail { color: #e85454; }
    .info { color: #6eb8e0; }
    .checklist {
      margin-top: 1rem;
      padding: 1rem;
      background: #222;
      border: 1px solid #444;
      border-radius: 3px;
    }
    .checklist label {
      display: block;
      margin-bottom: 0.4rem;
      cursor: pointer;
    }
    .checklist input {
      margin-right: 0.5rem;
    }
  </style>
</head>
<body>
  <h1>Voices Test</h1>
  <button id="btn-play">&#9654; Resume AudioContext</button>
  <button id="btn-run">Run Tests</button>
  <button id="btn-stop">&#9632; Stop All</button>
  <pre id="log"></pre>
  <div class="checklist" id="checklist" style="display:none;">
    <p><strong>Did you hear each voice?</strong></p>
    <label><input type="checkbox" data-voice="kick"> Kick (deep thump)</label>
    <label><input type="checkbox" data-voice="snare"> Snare (rattly snap)</label>
    <label><input type="checkbox" data-voice="hat"> Hat (metallic tick)</label>
    <label><input type="checkbox" data-voice="bass"> Bass (plucky low tone)</label>
    <label><input type="checkbox" data-voice="poly"> Poly (lush sustained pad)</label>
  </div>

  <script type="module">
    import { kick, snare, hat, bass, poly } from '../src/audio/voices/index.js';
    import { initNoise } from '../src/audio/noise.js';

    const logEl = document.getElementById('log');
    const btnPlay = document.getElementById('btn-play');
    const btnRun = document.getElementById('btn-run');
    const btnStop = document.getElementById('btn-stop');
    const checklistEl = document.getElementById('checklist');

    let ctx = null;

    function log(msg, cls) {
      const span = document.createElement('span');
      if (cls) span.className = cls;
      span.textContent = msg + '\n';
      logEl.appendChild(span);
      logEl.scrollTop = logEl.scrollHeight;
    }
    function pass(name) { log(`\u2713 ${name}`, 'pass'); }
    function fail(name, err) { log(`\u2717 ${name}: ${err}`, 'fail'); }
    function info(msg) { log(`  ${msg}`, 'info'); }

    btnPlay.addEventListener('click', async () => {
      if (!ctx) ctx = new AudioContext({ sampleRate: 44100 });
      if (ctx.state === 'suspended') await ctx.resume();
      log(`AudioContext resumed (${ctx.state}, ${ctx.sampleRate} Hz)`);
    });

    btnStop.addEventListener('click', () => {
      if (ctx) {
        ctx.close();
        ctx = null;
        log('AudioContext closed. All voices stopped.');
      }
    });

    btnRun.addEventListener('click', async () => {
      logEl.textContent = '';
      checklistEl.style.display = 'none';
      log('Voices Test\n');

      if (!ctx) ctx = new AudioContext({ sampleRate: 44100 });
      if (ctx.state === 'suspended') await ctx.resume();

      // Initialize noise buffer (needed by snare and hat)
      initNoise(ctx);

      const dest = ctx.destination;
      const startTime = ctx.currentTime + 0.5;
      let errors = 0;

      // Schedule each voice sequentially
      const voices = [
        { name: 'Kick',  fn: kick,  offset: 0,    params: { step: 0, voice: 0, velocity: 1.0 } },
        { name: 'Snare', fn: snare, offset: 0.5,  params: { step: 1, voice: 1, tone: 0.5, velocity: 0.8 } },
        { name: 'Hat',   fn: hat,   offset: 1.0,  params: { step: 2, voice: 2, open: false, velocity: 0.7 } },
        { name: 'Bass',  fn: bass,  offset: 1.5,  params: { step: 3, voice: 3, frequency: 55, duration: 0.5, velocity: 0.8 } },
        { name: 'Poly',  fn: poly,  offset: 2.3,  params: { step: 4, voice: 4, frequency: 220, duration: 1.2, velocity: 0.16 } },
      ];

      for (const v of voices) {
        const t = startTime + v.offset;
        try {
          info(`Playing ${v.name} at t=${t.toFixed(4)}s`);
          v.fn(ctx, dest, t, v.params);
        } catch (e) {
          fail(`${v.name} play()`, e.message);
          errors++;
        }
      }

      if (errors === 0) {
        pass('All five voices scheduled');
      } else {
        fail('All five voices scheduled', `${errors} error(s)`);
      }

      info('\nListen for: kick \u2192 snare \u2192 hat \u2192 bass \u2192 poly');
      info('Waiting 5 seconds for all voices to complete...\n');

      // Wait for all voices to finish (poly is longest: offset 2.3 + ADSR ~2.2s)
      await new Promise(r => setTimeout(r, 5000));

      // Results
      pass('No crashing or stalling (reached end of 5s window)');

      // Check for console errors (basic)
      const origError = console.error;
      let consoleErrors = 0;
      console.error = (...args) => { consoleErrors++; origError(...args); };
      // Restore after a tick
      setTimeout(() => { console.error = origError; }, 100);

      if (consoleErrors === 0) {
        pass('No console errors detected during playback');
      } else {
        fail('No console errors', `${consoleErrors} error(s) in console`);
      }

      // Show manual confirmation checklist
      checklistEl.style.display = 'block';
      info('Check the boxes below for each voice you heard.');

      log('\nDone.');
    });
  </script>
</body>
</html>
