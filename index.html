<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rondel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'SF Mono', 'Fira Code', monospace;
      background: #1a1a1a;
      color: #e0e0e0;
      padding: 2rem;
      line-height: 1.6;
    }
    h1 { margin-bottom: 1rem; font-size: 1.4rem; }
    .controls {
      margin-bottom: 1rem;
    }
    button {
      font-family: inherit;
      font-size: 1rem;
      padding: 0.6rem 1.2rem;
      cursor: pointer;
      background: #333;
      color: #e0e0e0;
      border: 1px solid #555;
      border-radius: 4px;
      margin-right: 0.5rem;
    }
    button:hover { background: #444; }
    button:active { background: #555; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    #status {
      margin-bottom: 1rem;
      font-size: 0.9rem;
      color: #888;
    }
    #canvas-placeholder {
      width: 100%;
      max-width: 600px;
      height: 300px;
      background: #111;
      border: 1px solid #333;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #444;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>
  <h1>Rondel</h1>
  <div class="controls">
    <button id="btn-play">&#9654; Play</button>
    <button id="btn-stop" disabled>&#9632; Stop</button>
  </div>
  <p id="status">Ready</p>
  <div id="canvas-placeholder">Canvas will render here</div>

  <script type="module">
    import { start, stop, playing } from './src/main.js';

    const btnPlay = document.getElementById('btn-play');
    const btnStop = document.getElementById('btn-stop');
    const status = document.getElementById('status');

    btnPlay.addEventListener('click', async () => {
      btnPlay.disabled = true;
      status.textContent = 'Starting...';
      
      try {
        await start({ bpm: 120 });
        status.textContent = 'Playing at 120 BPM';
        btnStop.disabled = false;
      } catch (e) {
        status.textContent = `Error: ${e.message}`;
        btnPlay.disabled = false;
      }
    });

    btnStop.addEventListener('click', () => {
      stop();
      status.textContent = 'Stopped';
      btnPlay.disabled = false;
      btnStop.disabled = true;
    });
  </script>
</body>
</html>
