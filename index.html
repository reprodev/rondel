<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rondel</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='7' fill='none' stroke='%23e0e0e0' stroke-width='1.5'/><circle cx='8' cy='4' r='1.5' fill='%23e0e0e0'/></svg>">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'SF Mono', 'Fira Code', monospace;
      background: #1a1a1a;
      color: #e0e0e0;
      padding: 2rem;
      line-height: 1.6;
    }
    h1 { margin-bottom: 1rem; font-size: 1.4rem; }
    button, select {
      font-family: inherit;
      font-size: 0.9rem;
      padding: 0.5rem 0.8rem;
      cursor: pointer;
      background: #333;
      color: #e0e0e0;
      border: 1px solid #555;
      border-radius: 4px;
      margin-right: 0.5rem;
    }
    button:hover, select:hover { background: #444; }
    button:active { background: #555; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    select { margin-bottom: 1rem; }
    #canvas-placeholder {
      width: 100%;
      max-width: 600px;
      height: 600px;
      background: #111;
      border: 1px solid #333;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #444;
      font-size: 0.85rem;
      margin-bottom: 1.5rem;
    }
    .preset-bar {
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .preset-bar label {
      font-size: 0.85rem;
      color: #888;
    }
    .voice-selection {
      background: #222;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 1rem 1.2rem;
      max-width: 600px;
    }
    .voice-selection h2 {
      font-size: 0.95rem;
      margin-bottom: 0.6rem;
      color: #aaa;
    }
    .voice-checkboxes {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 0.6rem;
    }
    .voice-checkboxes label {
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.9rem;
    }
    .voice-checkboxes input[type="checkbox"] {
      width: 1rem;
      height: 1rem;
      cursor: pointer;
    }
    #btn-all {
      font-size: 0.8rem;
      padding: 0.3rem 0.7rem;
    }
    .ring-controls {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      margin-bottom: 0.6rem;
    }
    .ring-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .ring-row input[type="checkbox"] {
      width: 1rem;
      height: 1rem;
      cursor: pointer;
    }
    .ring-label {
      font-size: 0.8rem;
      color: #888;
      width: 3.5rem;
    }
    .ring-row select {
      font-size: 0.8rem;
      padding: 0.25rem 0.5rem;
      margin: 0;
    }
  </style>
</head>
<body>
  <h1>Rondel</h1>
  <div id="canvas-placeholder">Canvas will render here</div>

  <div class="preset-bar">
    <label for="preset-select">Preset:</label>
    <select id="preset-select">
      <option value="">Default</option>
      <option value="Techno">Techno</option>
      <option value="Ambient">Ambient</option>
      <option value="Polymetric">Polymetric</option>
      <option value="Minimal">Minimal</option>
      <option value="Afro">Afro</option>
      <option value="Glitch">Glitch</option>
    </select>
  </div>

  <div class="voice-selection">
    <h2>Rings</h2>
    <div class="ring-controls">
      <div class="ring-row" data-ring="0">
        <input type="checkbox" data-voice="0" checked>
        <span class="ring-label">Ring 1:</span>
        <select data-ring-voice="0">
          <option value="kick">Kick</option>
          <option value="snare">Snare</option>
          <option value="hat">Hat</option>
          <option value="bass">Bass</option>
          <option value="poly">Poly</option>
          <option value="pluck">Pluck</option>
          <option value="clap">Clap</option>
          <option value="tom">Tom</option>
        </select>
      </div>
      <div class="ring-row" data-ring="1">
        <input type="checkbox" data-voice="1" checked>
        <span class="ring-label">Ring 2:</span>
        <select data-ring-voice="1">
          <option value="kick">Kick</option>
          <option value="snare" selected>Snare</option>
          <option value="hat">Hat</option>
          <option value="bass">Bass</option>
          <option value="poly">Poly</option>
          <option value="pluck">Pluck</option>
          <option value="clap">Clap</option>
          <option value="tom">Tom</option>
        </select>
      </div>
      <div class="ring-row" data-ring="2">
        <input type="checkbox" data-voice="2" checked>
        <span class="ring-label">Ring 3:</span>
        <select data-ring-voice="2">
          <option value="kick">Kick</option>
          <option value="snare">Snare</option>
          <option value="hat" selected>Hat</option>
          <option value="bass">Bass</option>
          <option value="poly">Poly</option>
          <option value="pluck">Pluck</option>
          <option value="clap">Clap</option>
          <option value="tom">Tom</option>
        </select>
      </div>
      <div class="ring-row" data-ring="3">
        <input type="checkbox" data-voice="3" checked>
        <span class="ring-label">Ring 4:</span>
        <select data-ring-voice="3">
          <option value="kick">Kick</option>
          <option value="snare">Snare</option>
          <option value="hat">Hat</option>
          <option value="bass" selected>Bass</option>
          <option value="poly">Poly</option>
          <option value="pluck">Pluck</option>
          <option value="clap">Clap</option>
          <option value="tom">Tom</option>
        </select>
      </div>
      <div class="ring-row" data-ring="4">
        <input type="checkbox" data-voice="4" checked>
        <span class="ring-label">Ring 5:</span>
        <select data-ring-voice="4">
          <option value="kick">Kick</option>
          <option value="snare">Snare</option>
          <option value="hat">Hat</option>
          <option value="bass">Bass</option>
          <option value="poly" selected>Poly</option>
          <option value="pluck">Pluck</option>
          <option value="clap">Clap</option>
          <option value="tom">Tom</option>
        </select>
      </div>
    </div>
    <button id="btn-all">All</button>
  </div>

  <script type="module">
    import { start, stop, playing, setActiveVoices, setRingVoice, getPatch } from './src/main.js';
    import { getPresetByName } from './src/state/presets.js';
    import { createPatch } from './src/state/patch.js';

    const presetSelect = document.getElementById('preset-select');
    const btnAll = document.getElementById('btn-all');
    const checkboxes = document.querySelectorAll('[data-voice]');
    const voiceDropdowns = document.querySelectorAll('[data-ring-voice]');

    function getSelectedVoices() {
      const selected = [];
      checkboxes.forEach(cb => {
        if (cb.checked) selected.push(Number(cb.dataset.voice));
      });
      return selected;
    }

    function onMuteChange() {
      setActiveVoices(getSelectedVoices());
    }

    checkboxes.forEach(cb => {
      cb.addEventListener('change', onMuteChange);
    });

    // Voice reassignment dropdowns
    voiceDropdowns.forEach(select => {
      select.addEventListener('change', () => {
        const ringIndex = Number(select.dataset.ringVoice);
        const voiceName = select.value;
        setRingVoice(ringIndex, voiceName);
      });
    });

    // Sync dropdowns to current patch on load
    function syncDropdowns() {
      const patch = getPatch();
      voiceDropdowns.forEach(select => {
        const ringIndex = Number(select.dataset.ringVoice);
        if (patch.rings[ringIndex]) {
          select.value = patch.rings[ringIndex].voice;
        }
      });
    }
    // Sync after a tick to let main.js bootstrap complete
    setTimeout(syncDropdowns, 50);

    if (btnAll) {
      btnAll.addEventListener('click', () => {
        const allChecked = [...checkboxes].every(cb => cb.checked);
        checkboxes.forEach(cb => { cb.checked = !allChecked; });
        onMuteChange();
      });
    }

    // Preset selector
    presetSelect.addEventListener('change', async () => {
      const name = presetSelect.value;
      if (playing()) stop();

      if (name) {
        const preset = getPresetByName(name);
        if (preset) {
          await start(preset);
          syncDropdowns();
        }
      } else {
        await start(createPatch());
        syncDropdowns();
      }
    });
  </script>
</body>
</html>
