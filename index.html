<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rondel</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='7' fill='none' stroke='%23e0e0e0' stroke-width='1.5'/><circle cx='8' cy='4' r='1.5' fill='%23e0e0e0'/></svg>">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      overflow: hidden;
    }
    body {
      font-family: 'SF Mono', 'Fira Code', monospace;
      background: #1a1a1a;
      color: #e0e0e0;
      line-height: 1.5;
    }

    /* --- Grid Layout --- */
    .app-grid {
      display: grid;
      height: 100vh;
      grid-template-columns: 320px 1fr;
      grid-template-rows: auto 1fr;
      grid-template-areas:
        "header header"
        "controls canvas";
    }

    .app-header {
      grid-area: header;
      padding: 0.8rem 1.2rem;
      border-bottom: 1px solid #333;
    }
    .app-header h1 {
      font-size: 1.2rem;
      display: inline;
    }

    .controls-panel {
      grid-area: controls;
      padding: 1rem;
      overflow-y: auto;
      border-right: 1px solid #333;
    }

    .canvas-area {
      grid-area: canvas;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      min-height: 0;
    }

    #canvas-placeholder {
      width: 100%;
      height: 100%;
      max-width: min(calc(100vh - 80px), 100%);
      max-height: calc(100vh - 80px);
      aspect-ratio: 1;
      background: #111;
      border: 1px solid #333;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #444;
      font-size: 0.85rem;
    }

    /* --- Tablet (< 1024px) --- */
    @media (max-width: 1023px) {
      html, body { overflow: auto; }
      .app-grid {
        height: auto;
        grid-template-columns: 1fr;
        grid-template-rows: auto auto auto;
        grid-template-areas:
          "header"
          "canvas"
          "controls";
      }
      .controls-panel {
        border-right: none;
        border-top: 1px solid #333;
        max-height: none;
        overflow-y: visible;
      }
      .canvas-area {
        height: 70vw;
        max-height: 600px;
      }
      #canvas-placeholder {
        max-width: 600px;
        max-height: 600px;
      }
    }

    /* --- Mobile (< 768px) --- */
    @media (max-width: 767px) {
      .canvas-area {
        height: 90vw;
        padding: 0.5rem;
      }
      .controls-panel {
        padding: 0.75rem;
      }
    }

    /* --- Controls styling --- */
    button, select {
      font-family: inherit;
      font-size: 0.85rem;
      padding: 0.4rem 0.7rem;
      cursor: pointer;
      background: #333;
      color: #e0e0e0;
      border: 1px solid #555;
      border-radius: 4px;
    }
    button:hover, select:hover { background: #444; }
    button:active { background: #555; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    .panel {
      background: #222;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 0.8rem 1rem;
      margin-bottom: 0.8rem;
    }
    .panel summary {
      font-size: 0.85rem;
      color: #aaa;
      cursor: pointer;
      padding: 0.3rem 0;
      margin-bottom: 0.5rem;
      list-style: none;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      user-select: none;
    }
    .panel summary::-webkit-details-marker { display: none; }
    .panel summary::after {
      content: '\25BC';
      font-size: 0.6rem;
      transition: transform 0.2s;
    }
    .panel:not([open]) summary::after {
      transform: rotate(-90deg);
    }
    .panel summary:hover {
      color: #e0e0e0;
    }

    .ring-controls {
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      margin-bottom: 0.5rem;
    }
    .ring-row {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .ring-row input[type="checkbox"] {
      width: 0.9rem;
      height: 0.9rem;
      cursor: pointer;
    }
    .ring-label {
      font-size: 0.75rem;
      color: #888;
      width: 3rem;
    }
    .ring-row select {
      font-size: 0.75rem;
      padding: 0.2rem 0.4rem;
      margin: 0;
    }
    #btn-all {
      font-size: 0.75rem;
      padding: 0.2rem 0.5rem;
    }

    .export-durations {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      margin-bottom: 0.5rem;
      flex-wrap: wrap;
    }
    .dur-btn {
      font-size: 0.75rem;
      padding: 0.2rem 0.5rem;
    }
    .dur-btn.active {
      background: #3a5a3a;
      border-color: #4ec96e;
    }
    #custom-dur {
      font-family: inherit;
      font-size: 0.75rem;
      width: 3.5rem;
      padding: 0.2rem 0.4rem;
      background: #2a2a2a;
      color: #e0e0e0;
      border: 1px solid #555;
      border-radius: 4px;
    }
    .export-btn {
      background: #2a5a3a;
      border-color: #4ec96e;
      color: #e0e0e0;
      font-size: 0.8rem;
      padding: 0.4rem 0.8rem;
    }
    .export-btn:hover { background: #3a7a4a; }
    .export-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .export-status {
      font-size: 0.75rem;
      color: #888;
      margin-left: 0.4rem;
    }

    /* --- Preset Browser --- */
    .preset-browser {
      margin-bottom: 1rem;
    }
    .preset-browser > label {
      display: block;
      font-size: 0.85rem;
      color: #999;
      margin-bottom: 0.5rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .preset-category {
      margin-bottom: 0.75rem;
      border: 1px solid #333;
      border-radius: 4px;
      padding: 0.5rem;
    }
    .preset-category[open] {
      background: #1a1a1a;
    }
    .category-header {
      cursor: pointer;
      user-select: none;
      padding: 0.5rem;
      color: #aaa;
      font-size: 0.9rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      list-style: none;
    }
    .category-header::-webkit-details-marker { display: none; }
    .category-header:hover {
      color: #fff;
    }
    .preset-list {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      padding: 0.5rem 0 0 0;
      max-height: 200px;
      overflow-y: auto;
    }
    .preset-btn {
      background: #222;
      border: 1px solid #444;
      color: #bbb;
      padding: 0.4rem 0.6rem;
      border-radius: 3px;
      cursor: pointer;
      font-size: 0.85rem;
      text-align: left;
      transition: all 0.15s;
    }
    .preset-btn:hover {

      color: #fff;

    }
    .preset-btn.active {
      background: #2a4a6a;
      color: #60d5ff;
      border-color: #60d5ff;
    }
  </style>
</head>

  <script type="module">
    import { start, stop, playing, setActiveVoices, setRingVoice, getPatch, exportCurrentPatch } from './src/main.js';
    import { getPresetByName } from './src/state/presets.js';
    import { createPatch } from './src/state/patch.js';

    const btnAll = document.getElementById('btn-all');
    const checkboxes = document.querySelectorAll('[data-voice]');
    const voiceDropdowns = document.querySelectorAll('[data-ring-voice]');
    const durButtons = document.querySelectorAll('.dur-btn');
    const customDur = document.getElementById('custom-dur');
    const btnExport = document.getElementById('btn-export');
    const exportStatus = document.getElementById('export-status');

    let selectedDuration = 30;

    function getSelectedVoices() {
      const selected = [];
      checkboxes.forEach(cb => {
        if (cb.checked) selected.push(Number(cb.dataset.voice));
      });
      return selected;
    }

    function onMuteChange() {
      setActiveVoices(getSelectedVoices());
    }

    checkboxes.forEach(cb => {
      cb.addEventListener('change', onMuteChange);
    });

    voiceDropdowns.forEach(select => {
      select.addEventListener('change', () => {
        const ringIndex = Number(select.dataset.ringVoice);
        setRingVoice(ringIndex, select.value);
      });
    });

    function syncDropdowns() {
      const patch = getPatch();
      voiceDropdowns.forEach(select => {
        const ringIndex = Number(select.dataset.ringVoice);
        if (patch.rings[ringIndex]) {
          select.value = patch.rings[ringIndex].voice;
        }
      });
    }
    setTimeout(syncDropdowns, 50);

    // Preset browser buttons
    const presetButtons = document.querySelectorAll('.preset-btn');
    presetButtons.forEach(btn => {
      btn.addEventListener('click', async () => {
        const name = btn.dataset.preset;
        if (playing()) stop();
        const preset = getPresetByName(name);
        if (preset) {
          presetButtons.forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          await start(preset);
          syncDropdowns();
        }
      });
    });

    if (btnAll) {
      btnAll.addEventListener('click', () => {
        const allChecked = [...checkboxes].every(cb => cb.checked);
        checkboxes.forEach(cb => { cb.checked = !allChecked; });
        onMuteChange();
      });
    }

    durButtons.forEach(btn => {
      btn.addEventListener('click', () => {
        durButtons.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedDuration = Number(btn.dataset.dur);
        customDur.value = '';
      });
    });
    document.querySelector('[data-dur="30"]')?.classList.add('active');

    customDur.addEventListener('input', () => {
      if (customDur.value) {
        durButtons.forEach(b => b.classList.remove('active'));
        selectedDuration = Math.max(1, Math.min(600, Number(customDur.value)));
      }
    });

    btnExport.addEventListener('click', async () => {
      const dur = customDur.value ? Math.max(1, Math.min(600, Number(customDur.value))) : selectedDuration;
      btnExport.disabled = true;
      exportStatus.textContent = 'Exporting...';
      try {
        await exportCurrentPatch(dur);
        exportStatus.textContent = 'Downloaded!';
      } catch (e) {
        exportStatus.textContent = `Error: ${e.message}`;
      }
      btnExport.disabled = false;
      setTimeout(() => { exportStatus.textContent = ''; }, 3000);
    });

    // Persist collapse state
    const ringsPanel = document.getElementById('rings-panel');
    const exportPanel = document.getElementById('export-panel');

    function restoreCollapseState() {
      const ringsOpen = localStorage.getItem('rondel-rings-open');
      const exportOpen = localStorage.getItem('rondel-export-open');
      if (ringsOpen !== null) ringsPanel.open = ringsOpen === 'true';
      if (exportOpen !== null) exportPanel.open = exportOpen === 'true';
    }
    restoreCollapseState();

    ringsPanel.addEventListener('toggle', () => {
      localStorage.setItem('rondel-rings-open', ringsPanel.open);
    });
    exportPanel.addEventListener('toggle', () => {
      localStorage.setItem('rondel-export-open', exportPanel.open);
    });
  </script>
