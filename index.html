<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rondel</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><circle cx='8' cy='8' r='7' fill='none' stroke='%23e0e0e0' stroke-width='1.5'/><circle cx='8' cy='4' r='1.5' fill='%23e0e0e0'/></svg>">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'SF Mono', 'Fira Code', monospace;
      background: #1a1a1a;
      color: #e0e0e0;
      padding: 2rem;
      line-height: 1.6;
    }
    h1 { margin-bottom: 1rem; font-size: 1.4rem; }
    button, select {
      font-family: inherit;
      font-size: 0.9rem;
      padding: 0.5rem 0.8rem;
      cursor: pointer;
      background: #333;
      color: #e0e0e0;
      border: 1px solid #555;
      border-radius: 4px;
      margin-right: 0.5rem;
    }
    button:hover, select:hover { background: #444; }
    button:active { background: #555; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    select { margin-bottom: 1rem; }
    #canvas-placeholder {
      width: 100%;
      max-width: 600px;
      height: 600px;
      background: #111;
      border: 1px solid #333;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #444;
      font-size: 0.85rem;
      margin-bottom: 1.5rem;
    }
    .preset-bar {
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .preset-bar label {
      font-size: 0.85rem;
      color: #888;
    }
    .voice-selection {
      background: #222;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 1rem 1.2rem;
      max-width: 600px;
    }
    .voice-selection h2 {
      font-size: 0.95rem;
      margin-bottom: 0.6rem;
      color: #aaa;
    }
    .voice-checkboxes {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 0.6rem;
    }
    .voice-checkboxes label {
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.9rem;
    }
    .voice-checkboxes input[type="checkbox"] {
      width: 1rem;
      height: 1rem;
      cursor: pointer;
    }
    #btn-all {
      font-size: 0.8rem;
      padding: 0.3rem 0.7rem;
    }
  </style>
</head>
<body>
  <h1>Rondel</h1>
  <div id="canvas-placeholder">Canvas will render here</div>

  <div class="preset-bar">
    <label for="preset-select">Preset:</label>
    <select id="preset-select">
      <option value="">Default</option>
      <option value="Techno">Techno</option>
      <option value="Ambient">Ambient</option>
      <option value="Polymetric">Polymetric</option>
      <option value="Minimal">Minimal</option>
      <option value="Afro">Afro</option>
      <option value="Glitch">Glitch</option>
    </select>
  </div>

  <div class="voice-selection">
    <h2>Voice Selection</h2>
    <div class="voice-checkboxes">
      <label><input type="checkbox" data-voice="0" checked> Kick</label>
      <label><input type="checkbox" data-voice="1" checked> Snare</label>
      <label><input type="checkbox" data-voice="2" checked> Hat</label>
      <label><input type="checkbox" data-voice="3" checked> Bass</label>
      <label><input type="checkbox" data-voice="4" checked> Poly</label>
    </div>
    <button id="btn-all">All</button>
  </div>

  <script type="module">
    import { start, stop, playing, setActiveVoices } from './src/main.js';
    import { getPresetByName } from './src/state/presets.js';
    import { createPatch } from './src/state/patch.js';

    const presetSelect = document.getElementById('preset-select');
    const btnAll = document.getElementById('btn-all');
    const checkboxes = document.querySelectorAll('[data-voice]');

    function getSelectedVoices() {
      const selected = [];
      checkboxes.forEach(cb => {
        if (cb.checked) selected.push(Number(cb.dataset.voice));
      });
      return selected;
    }

    function onVoiceChange() {
      setActiveVoices(getSelectedVoices());
    }

    checkboxes.forEach(cb => {
      cb.addEventListener('change', onVoiceChange);
    });

    if (btnAll) {
      btnAll.addEventListener('click', () => {
        const allChecked = [...checkboxes].every(cb => cb.checked);
        checkboxes.forEach(cb => { cb.checked = !allChecked; });
        onVoiceChange();
      });
    }

    // Preset selector: load and start playback on change
    presetSelect.addEventListener('change', async () => {
      const name = presetSelect.value;

      // Stop current playback before switching
      if (playing()) stop();

      if (name) {
        const preset = getPresetByName(name);
        if (preset) {
          await start(preset);
        }
      } else {
        // "Default" selected — load fresh default patch
        await start(createPatch());
      }
    });
  </script>
</body>
</html>
