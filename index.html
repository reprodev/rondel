<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rondel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'SF Mono', 'Fira Code', monospace;
      background: #1a1a1a;
      color: #e0e0e0;
      padding: 2rem;
      line-height: 1.6;
    }
    h1 { margin-bottom: 1rem; font-size: 1.4rem; }
    .controls {
      margin-bottom: 1rem;
    }
    button {
      font-family: inherit;
      font-size: 1rem;
      padding: 0.6rem 1.2rem;
      cursor: pointer;
      background: #333;
      color: #e0e0e0;
      border: 1px solid #555;
      border-radius: 4px;
      margin-right: 0.5rem;
    }
    button:hover { background: #444; }
    button:active { background: #555; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    #status {
      margin-bottom: 1rem;
      font-size: 0.9rem;
      color: #888;
    }
    #canvas-placeholder {
      width: 100%;
      max-width: 600px;
      height: 300px;
      background: #111;
      border: 1px solid #333;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #444;
      font-size: 0.85rem;
      margin-bottom: 1.5rem;
    }
    .voice-selection {
      background: #222;
      border: 1px solid #444;
      border-radius: 6px;
      padding: 1rem 1.2rem;
      max-width: 600px;
    }
    .voice-selection h2 {
      font-size: 0.95rem;
      margin-bottom: 0.6rem;
      color: #aaa;
    }
    .voice-checkboxes {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      align-items: center;
      margin-bottom: 0.6rem;
    }
    .voice-checkboxes label {
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      font-size: 0.9rem;
    }
    .voice-checkboxes input[type="checkbox"] {
      width: 1rem;
      height: 1rem;
      cursor: pointer;
    }
    #btn-all {
      font-size: 0.8rem;
      padding: 0.3rem 0.7rem;
    }
  </style>
</head>
<body>
  <h1>Rondel</h1>
  <div class="controls">
    <button id="btn-play">&#9654; Play</button>
    <button id="btn-stop" disabled>&#9632; Stop</button>
  </div>
  <p id="status">Ready</p>
  <div id="canvas-placeholder">Canvas will render here</div>

  <div class="voice-selection">
    <h2>Voice Selection</h2>
    <div class="voice-checkboxes">
      <label><input type="checkbox" data-voice="0" checked> Kick</label>
      <label><input type="checkbox" data-voice="1" checked> Snare</label>
      <label><input type="checkbox" data-voice="2" checked> Hat</label>
      <label><input type="checkbox" data-voice="3" checked> Bass</label>
      <label><input type="checkbox" data-voice="4" checked> Poly</label>
    </div>
    <button id="btn-all">All</button>
  </div>

  <script type="module">
    import { start, stop, playing, setActiveVoices } from './src/main.js';

    const btnPlay = document.getElementById('btn-play');
    const btnStop = document.getElementById('btn-stop');
    const btnAll = document.getElementById('btn-all');
    const status = document.getElementById('status');
    const checkboxes = document.querySelectorAll('[data-voice]');

    function getSelectedVoices() {
      const selected = [];
      checkboxes.forEach(cb => {
        if (cb.checked) selected.push(Number(cb.dataset.voice));
      });
      return selected;
    }

    function onVoiceChange() {
      setActiveVoices(getSelectedVoices());
    }

    checkboxes.forEach(cb => {
      cb.addEventListener('change', onVoiceChange);
    });

    btnAll.addEventListener('click', () => {
      const allChecked = [...checkboxes].every(cb => cb.checked);
      checkboxes.forEach(cb => { cb.checked = !allChecked; });
      onVoiceChange();
    });

    btnPlay.addEventListener('click', async () => {
      btnPlay.disabled = true;
      status.textContent = 'Starting...';

      try {
        await start({ bpm: 120, activeVoices: getSelectedVoices() });
        status.textContent = 'Playing at 120 BPM';
        btnStop.disabled = false;
      } catch (e) {
        status.textContent = `Error: ${e.message}`;
        btnPlay.disabled = false;
      }
    });

    btnStop.addEventListener('click', () => {
      stop();
      status.textContent = 'Stopped';
      btnPlay.disabled = false;
      btnStop.disabled = true;
    });
  </script>
</body>
</html>
